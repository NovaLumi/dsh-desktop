name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript Main Process
        run: npm run build

      - name: Build & Publish Release Assets
        uses: electron-userland/electron-builder-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
