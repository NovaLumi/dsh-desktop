<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DeepSeek Harness 启动中</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      border: 1px solid #1e293b;
      border-radius: 12px;
    }
    .logo-container {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    .spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(59, 130, 246, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .icon-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      height: 20px;
      text-align: center;
      transition: all 0.3s;
    }
    .progress-bar {
      width: 260px;
      height: 4px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 18px;
    }
    .progress-inner {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    /* 更新模态面板 */
    .update-box {
      display: none;
      position: absolute;
      bottom: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .update-box.show {
      display: block;
    }
    .update-title {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .update-desc {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    button.secondary {
      background: #334155;
      color: #cbd5e1;
    }
    button.secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="spinner"></div>
    <div class="icon-inner">🐳</div>
  </div>
  <h1>DeepSeek Harness</h1>
  <div id="status" class="status-text">正在启动系统服务...</div>
  <div class="progress-bar">
    <div class="progress-inner"></div>
  </div>

  <div id="updateModal" class="update-box">
    <div class="update-title" id="updateTitle">发现官方核心新版本</div>
    <div class="update-desc" id="updateDesc">新版本包含重要优化，建议立即更新。</div>
    <div class="btn-group">
      <button id="btnUpgrade">立即更新</button>
      <button id="btnSkip" class="secondary">暂不更新并启动</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const updateModal = document.getElementById('updateModal');
    const updateTitle = document.getElementById('updateTitle');
    const updateDesc = document.getElementById('updateDesc');
    const btnUpgrade = document.getElementById('btnUpgrade');
    const btnSkip = document.getElementById('btnSkip');

    if (window.dshDesktop) {
      window.dshDesktop.on('status', (msg) => {
        statusEl.innerText = msg;
      });

      window.dshDesktop.on('dsh-update-found', (data) => {
        updateTitle.innerText = `发现 DSH 官方新版本 v${data.latestVersion}`;
        updateDesc.innerText = `本地当前版本: v${data.currentVersion}。更新将执行官方 npm 升级命令。`;
        updateModal.classList.add('show');
      });

      btnUpgrade.addEventListener('click', () => {
        window.dshDesktop.send('confirm-dsh-upgrade', true);
        updateModal.classList.remove('show');
        statusEl.innerText = '正在执行官方更新命令 (npm install -g @deepseek-ai/dsh)...';
      });

      btnSkip.addEventListener('click', () => {
        window.dshDesktop.send('confirm-dsh-upgrade', false);
        updateModal.classList.remove('show');
        statusEl.innerText = '已跳过更新，正在拉起服务...';
      });
    }
  </script>
</body>
</html>
